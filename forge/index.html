<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>鍛造原型</title>
<style>
  :root {
    --bg: #1b1612; --panel: #27201a; --panel2: #332a22; --line: #4a3c30;
    --text: #efe6d8; --muted: #a8998a; --amber: #f2a541; --amber2: #ffcf7a;
    --red: #e5533d; --green: #6cc46a; --purple: #c38cff; --blue: #7fb6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  body { padding: 12px 16px 40px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  header h1 { font-size: 18px; margin: 0; color: var(--amber2); font-weight: 600; }
  header .ver { color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 8px; }
  .stat { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 20px; font-weight: 700; }
  .stat .v small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .weapon { margin-top: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; position: relative; }
  .weapon .grade { font-size: 56px; font-weight: 800; line-height: 1; color: var(--amber2); }
  .weapon .grade small { font-size: 18px; color: var(--muted); font-weight: 500; margin-left: 6px; }
  .weapon .sub { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; color: var(--muted); font-size: 13px; }
  .weapon .sub b { color: var(--text); }
  .charge { margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .charge .bar { flex: 1; height: 10px; background: var(--panel2); border-radius: 5px; overflow: hidden; }
  .charge .bar i { display: block; height: 100%; background: var(--amber); width: 0; transition: width .15s; }
  .weapon.fever { border-color: var(--amber); box-shadow: 0 0 0 2px rgba(242,165,65,.25), 0 0 24px rgba(242,165,65,.25); }
  .weapon.fever .charge .bar i { background: var(--purple); }
  .weapon.broke { animation: shake .35s; border-color: var(--red); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
  .paper { margin-top: 8px; background: #efe3cc; color: #2a2018; border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .paper h2 { margin: 0 0 6px; font-size: 14px; display: flex; justify-content: space-between; font-weight: 700; }
  .paper h2 span { font-weight: 400; color: #6b5a48; }
  .trow { display: grid; grid-template-columns: 48px 32px 52px 1fr; gap: 6px; align-items: center; padding: 3px 0; border-top: 1px dashed #cdbda2; }
  .trow:first-of-type { border-top: 0; }
  .trow .n { font-weight: 700; }
  .trow .c { font-weight: 700; text-align: right; }
  .trow .p { color: #6b5a48; text-align: right; font-variant-numeric: tabular-nums; }
  .trow .g { font-size: 11px; letter-spacing: 1px; line-height: 1.2; word-break: break-all; }
  .g .b { color: #7a6650; } .g .x { color: #c23f2c; } .g .a { color: #2f8f3a; } .g .w { color: #7b3fcf; }
  .g .fev { color: #7b3fcf; font-weight: 700; letter-spacing: 0; }
  .trow.break .n { color: #b2321f; }
  .paper .legend { margin-top: 6px; font-size: 11px; color: #6b5a48; }
  .paper .legend .x { color: #c23f2c; } .paper .legend .a { color: #2f8f3a; } .paper .legend .w { color: #7b3fcf; }
  .actions { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; margin-top: 10px; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 14px 10px; cursor: pointer; color: var(--text); background: var(--panel2); font-weight: 600; -webkit-tap-highlight-color: transparent; }
  button:disabled { opacity: .35; cursor: default; }
  button.primary { background: var(--amber); color: #2a1b06; font-size: 22px; padding: 18px 10px; }
  button.primary:active:not(:disabled) { transform: translateY(1px); filter: brightness(.95); }
  button.danger { background: #4a2a24; }
  .log { margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; min-height: 60px; }
  .log .e { display: flex; gap: 8px; padding: 4px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .log .e:first-child { border-top: 0; font-size: 16px; }
  .log .o { width: 64px; font-weight: 700; flex: none; }
  .log .o.break { color: var(--red); } .log .o.great { color: var(--green); } .log .o.success { color: var(--amber2); }
  .log .o.damage { color: #e59a8c; } .log .o.hold { color: var(--muted); } .log .o.saved { color: var(--blue); } .log .o.shelve { color: var(--purple); }
  .log .d { color: var(--muted); flex: 1; }
  .log .d b { color: var(--text); }
  .log .procs { font-size: 12px; color: var(--blue); }
  .relics { margin-top: 10px; }
  .relics h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
  .chip.shield { border-color: var(--blue); }
  .chip.empty { color: var(--muted); border-style: dashed; }
  .chip .st { color: var(--blue); font-size: 12px; margin-left: 4px; }
  details { margin-top: 10px; color: var(--muted); font-size: 13px; }
  details summary { cursor: pointer; color: var(--text); }
  details ul { padding-left: 18px; margin: 6px 0; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none; align-items: flex-end; justify-content: center; padding: 12px; z-index: 10; }
  .modal.on { display: flex; }
  .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; overflow-x: hidden; }
  .sheet h2 { margin: 0 0 4px; font-size: 18px; color: var(--amber2); }
  .sheet .hint { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .card { width: 100%; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 8px; font-weight: 400; }
  .card .t { font-weight: 700; font-size: 17px; }
  .card .t .fam { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 8px; }
  .card .t .fam.shield { color: var(--blue); }
  .card .fx { margin-top: 4px; color: var(--green); }
  .card .cost { color: #e59a8c; font-size: 14px; }
  .card.drop { border-color: var(--red); }
  .skip { width: 100%; margin-top: 10px; }
  .end .score { font-size: 64px; font-weight: 800; color: var(--amber2); line-height: 1; margin: 6px 0; }
  .end .score small { font-size: 16px; color: var(--muted); font-weight: 500; margin-left: 8px; }
  .end .new { color: var(--green); font-weight: 700; }
  .end dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 10px 0; font-size: 14px; }
  .end dt { color: var(--muted); } .end dd { margin: 0; }
  .records { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  .records table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .records th, .records td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  .records th { color: var(--muted); font-weight: 500; }
  .records td.route { color: var(--muted); }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>鍛造原型</h1><span class="ver" id="ver"></span></header>

  <div class="row">
    <div class="stat"><div class="k">剩餘鎚數</div><div class="v" id="strikes">—</div></div>
    <div class="stat"><div class="k">本局最高收起</div><div class="v" id="best">0</div></div>
    <div class="stat"><div class="k">歷史最高</div><div class="v" id="hist">0</div></div>
  </div>

  <div class="weapon" id="weapon">
    <div class="grade"><span id="grade">+0</span><small id="wserial"></small></div>
    <div class="sub" id="wsub"></div>
    <div class="charge"><span id="chargeLabel">充能</span><div class="bar"><i id="chargeBar"></i></div><span id="chargeText">0/10</span></div>
  </div>

  <div class="paper">
    <h2>抽籤表 <span id="total"></span></h2>
    <div id="rows"></div>
    <div class="legend">基礎 ■ 　<span class="x">✕ 遺物劃掉</span>　<span class="a">■ 遺物新增</span>　<span class="w">■ 只對這把武器</span></div>
  </div>

  <div class="actions">
    <button class="primary" id="btnStrike">敲</button>
    <button id="btnShelve">收起</button>
    <button class="danger" id="btnEnd">結束</button>
  </div>

  <div class="log" id="log"></div>

  <div class="relics">
    <h3 id="relicTitle">遺物</h3>
    <div class="chips" id="chips"></div>
  </div>

  <details>
    <summary>規則</summary>
    <ul id="rules"></ul>
  </details>

  <div class="records" id="records"></div>
</div>

<div class="modal" id="offerModal"><div class="sheet" id="offerSheet"></div></div>
<div class="modal" id="endModal"><div class="sheet end" id="endSheet"></div></div>

<script src="config.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  const cfg = window.FORGE_CONFIG, E = window.ForgeEngine;
  const $ = id => document.getElementById(id);
  const KEY = 'forge-proto-records-v1';
  let s = null, pendingPick = null, lastResult = null;

  // ---------- 紀錄 ----------
  function loadRecords() {
    try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && typeof r === 'object') return r; } catch (e) {}
    return { bestScore: 0, bestTouched: 0, runs: 0, history: [] };
  }
  function saveRecords(r) { try { localStorage.setItem(KEY, JSON.stringify(r)); } catch (e) {} }
  let rec = loadRecords();

  // ---------- 工具 ----------
  function name(id) { const d = E.relicDef(cfg, id); return d ? d.name : id; }
  function glyphs(ch, n, cls) { n = Math.max(0, n); if (!n) return ''; const cap = 36; const str = ch.repeat(Math.min(n, cap)) + (n > cap ? '…' : ''); return '<span class="' + cls + '">' + str + '</span>'; }
  function pct(x) { return (100 * x).toFixed(1) + '%'; }
  function esc(t) { return String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

  // ---------- 畫面 ----------
  function render() {
    $('ver').textContent = cfg.version;
    const w = s.weapon, t = E.tickets(s), fp = E.feverParams(s);
    $('strikes').innerHTML = s.strikesLeft + '<small>/' + cfg.strikesPerRun + '</small>';
    $('best').textContent = s.bestShelved;
    $('hist').textContent = rec.bestScore;

    $('grade').textContent = '+' + w.grade;
    $('wserial').textContent = '第 ' + w.serial + ' 把';
    const sub = [];
    sub.push('本把最高 <b>' + w.peak + '</b>');
    if (w.scar) sub.push('疤 <b>+' + w.scar + '</b> 張破壞籤');
    if (w.gearTickets) sub.push('齒輪 <b>+' + w.gearTickets + '</b> 張成功籤');
    const blade = s.relics.includes('blade'), pact = s.relics.includes('pact');
    if (blade) sub.push('備用刃 <b>' + (w.bladeUsed ? '已用' : '可用') + '</b>');
    if (pact) sub.push('血契護盾 <b>' + w.shield + '</b>（損傷 ' + (w.damages % (E.relicDef(cfg, 'pact').damagesPerShield)) + '/' + E.relicDef(cfg, 'pact').damagesPerShield + '）');
    if (s.relics.includes('slow')) sub.push('慢火維持 <b>' + (w.holds % E.relicDef(cfg, 'slow').holdsNeeded) + '/' + E.relicDef(cfg, 'slow').holdsNeeded + '</b>');
    $('wsub').innerHTML = sub.join('　');

    const weaponEl = $('weapon');
    weaponEl.classList.toggle('fever', t.inFever);
    if (t.inFever) {
      $('chargeLabel').textContent = '入神中';
      $('chargeBar').style.width = (100 * w.feverLeft / fp.strikes) + '%';
      $('chargeText').textContent = '剩 ' + w.feverLeft + ' 鎚';
    } else {
      $('chargeLabel').textContent = '充能';
      $('chargeBar').style.width = (100 * w.charge / fp.threshold) + '%';
      $('chargeText').textContent = w.charge + '/' + fp.threshold;
    }

    // 籤紙
    $('total').textContent = '共 ' + t.total + ' 張';
    let rows = '';
    for (const k of E.OUTCOMES) {
      const base = t.base[k], rl = t.relic[k], wp = t.weapon[k], fin = t.final[k];
      let g = '';
      if (k === 'break' && t.inFever) {
        g = '<span class="fev">入神：破壞籤 0</span>';
      } else {
        const removed = Math.min(base, Math.max(0, -rl));
        const kept = base - removed;
        const added = Math.max(0, rl);
        const wAdd = Math.max(0, wp);
        let extraRemoved = Math.max(0, -rl - removed); // 遺物減超過基礎的部分，吃掉武器加成
        g = glyphs('■', kept, 'b') + glyphs('✕', removed, 'x') + glyphs('■', added, 'a') + glyphs('■', wAdd - Math.min(wAdd, extraRemoved), 'w');
        if (k === 'break' && fin > kept + added + wAdd) g += glyphs('■', fin - (kept + added + wAdd), 'b'); // 鐵箍最低 1
      }
      rows += '<div class="trow ' + k + '"><div class="n">' + E.LABEL[k] + '</div><div class="c">' + fin + '</div><div class="p">' + pct(t.pct[k]) + '</div><div class="g">' + g + '</div></div>';
    }
    $('rows').innerHTML = rows;

    // 按鈕
    const busy = !!s.offer || s.ended;
    $('btnStrike').disabled = busy;
    $('btnShelve').disabled = busy || w.grade <= 0 || t.inFever;
    $('btnEnd').disabled = busy;
    $('btnShelve').textContent = t.inFever ? '入神中' : '收起 +' + w.grade;

    // 記錄
    $('log').innerHTML = s.log.slice(0, 8).map(e => {
      let d = '';
      if (e.outcome === 'shelve') d = '收起 <b>+' + e.before + '</b>，換新武器';
      else if (e.broke) d = '<b>+' + e.before + '</b> 碎了' + (cfg.onBreak === 'endRun' ? '，局結束' : '，換新武器');
      else d = '+' + e.before + ' → <b>+' + e.after + '</b>' + (e.inFever ? '　<span class="muted">入神</span>' : '');
      const procs = e.procs && e.procs.length ? '<div class="procs">' + e.procs.map(esc).join('　') + '</div>' : '';
      return '<div class="e"><div class="o ' + e.outcome + '">' + (E.LABEL[e.outcome] || e.outcome) + '</div><div class="d">' + d + procs + '</div></div>';
    }).join('') || '<div class="muted">還沒敲。</div>';

    // 遺物
    $('relicTitle').textContent = '遺物 ' + s.relics.length + '/' + cfg.relicSlots + '（護盾位 ' + cfg.shieldSlots + '）';
    let chips = s.relics.map(id => { const d = E.relicDef(cfg, id); return '<span class="chip' + (d.shield ? ' shield' : '') + '" title="' + esc(d.text + '。代價：' + d.cost) + '">' + d.name + (d.shield ? '<span class="st">護盾</span>' : '') + '</span>'; }).join('');
    for (let i = s.relics.length; i < cfg.relicSlots; i++) chips += '<span class="chip empty">空</span>';
    $('chips').innerHTML = chips;

    renderOffer();
    renderEnd();
    renderRecords();
  }

  function renderOffer() {
    const m = $('offerModal');
    if (!s.offer) { m.classList.remove('on'); pendingPick = null; return; }
    m.classList.add('on');
    const at = s.offer.at === 'start' ? '開局' : '本局首次到達 +' + s.offer.at;
    let html = '';
    if (pendingPick == null) {
      html += '<h2>' + at + '：遺物三選一</h2><div class="hint">遺物 ' + s.relics.length + '/' + cfg.relicSlots + '。護盾類同時只能持有 ' + cfg.shieldSlots + ' 個，拿新護盾會換掉舊的。</div>';
      s.offer.ids.forEach((id, i) => {
        const d = E.relicDef(cfg, id);
        html += '<button class="card" data-pick="' + i + '"><div class="t">' + d.name + '<span class="fam' + (d.shield ? ' shield' : '') + '">' + d.family + (d.shield && d.family !== '護盾' ? '・護盾' : '') + '</span></div><div class="fx">' + esc(d.text) + '</div><div class="cost">代價：' + esc(d.cost) + '</div></button>';
      });
      html += '<button class="skip" data-skip="1">跳過</button>';
    } else {
      const d = E.relicDef(cfg, s.offer.ids[pendingPick]);
      html += '<h2>遺物格滿了</h2><div class="hint">要拿「' + d.name + '」，得換掉一個：</div>';
      s.relics.forEach(id => { const h = E.relicDef(cfg, id); html += '<button class="card drop" data-drop="' + id + '"><div class="t">換掉 ' + h.name + '</div><div class="fx">' + esc(h.text) + '</div></button>'; });
      html += '<button class="skip" data-back="1">返回</button>';
    }
    $('offerSheet').innerHTML = html;
  }

  function renderEnd() {
    const m = $('endModal');
    if (!s.ended) { m.classList.remove('on'); return; }
    if (!m.classList.contains('on')) commitRecord();
    m.classList.add('on');
    const sm = E.summary(s);
    const reason = { strikes: '鎚數用完', quit: '主動結束', break: '武器破壞' }[sm.endReason] || '';
    const route = sm.route.map(r => (r.at === 'start' ? '開局' : '+' + r.at) + '：' + (r.picked ? name(r.picked) + (r.replaced ? '（換掉' + name(r.replaced) + '）' : '') : '跳過')).join('　');
    $('endSheet').innerHTML =
      '<h2>這一局結束　<span class="muted" style="font-size:13px">' + reason + '</span></h2>' +
      '<div class="score">' + sm.score + '<small>最高收起</small></div>' +
      (s._newRecord ? '<div class="new">歷史新高！</div>' : '<div class="muted">歷史最高 ' + rec.bestScore + '</div>') +
      '<dl><dt>最高觸及</dt><dd>' + sm.touched + '</dd><dt>收起</dt><dd>' + sm.shelved.map(g => '+' + g).join('、') + '</dd><dt>鎚數</dt><dd>' + sm.strikes + '</dd><dt>破壞</dt><dd>' + sm.breaks + ' 次</dd><dt>入神</dt><dd>' + sm.fevers + ' 次</dd><dt>護盾擋下</dt><dd>' + sm.saves + ' 次</dd><dt>路線</dt><dd>' + (route || '無') + '</dd><dt>最終遺物</dt><dd>' + (sm.relics.map(name).join('、') || '無') + '</dd></dl>' +
      '<button class="primary" id="btnAgain" style="width:100%">再來一局</button>';
    $('btnAgain').onclick = newGame;
  }

  function commitRecord() {
    if (s._recorded) return;
    s._recorded = true;
    const sm = E.summary(s);
    s._newRecord = sm.score > rec.bestScore;
    rec.bestScore = Math.max(rec.bestScore, sm.score);
    rec.bestTouched = Math.max(rec.bestTouched, sm.touched);
    rec.runs++;
    const d = new Date(), p2 = n => String(n).padStart(2, '0');
    rec.history.unshift({ date: d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()), score: sm.score, touched: sm.touched, breaks: sm.breaks, fevers: sm.fevers, route: sm.route.filter(r => r.picked).map(r => r.picked) });
    rec.history = rec.history.slice(0, 20);
    saveRecords(rec);
  }

  function renderRecords() {
    let html = '<h3 class="muted" style="margin:0 0 6px;font-size:13px;font-weight:500">紀錄　局數 ' + rec.runs + '　歷史最高 ' + rec.bestScore + '　最高觸及 ' + rec.bestTouched + '</h3>';
    if (rec.history.length) {
      html += '<table><tr><th>時間</th><th>分數</th><th>觸及</th><th>碎</th><th>路線</th></tr>' +
        rec.history.map(h => '<tr><td>' + h.date.slice(5) + '</td><td><b>' + h.score + '</b></td><td>' + h.touched + '</td><td>' + h.breaks + '</td><td class="route">' + h.route.map(name).join('→') + '</td></tr>').join('') + '</table>';
    }
    html += '<div style="margin-top:8px"><button id="btnClear" style="padding:8px 12px;font-size:13px">清除紀錄</button></div>';
    $('records').innerHTML = html;
    $('btnClear').onclick = () => { if (confirm('清除所有紀錄？')) { rec = { bestScore: 0, bestTouched: 0, runs: 0, history: [] }; saveRecords(rec); render(); } };
  }

  function renderRules() {
    const f = cfg.fever;
    $('rules').innerHTML = [
      '一局 ' + cfg.strikesPerRun + ' 鎚。每鎚扣 1。鎚數用完，鐵砧上的武器自動收起。',
      '五種結果：破壞（失去武器）、損傷 ' + cfg.gradeDelta.damage + '、維持 0、成功 +' + cfg.gradeDelta.success + '、大成功 +' + cfg.gradeDelta.great + '。',
      '籤是權重，每一鎚獨立抽，籤不會用掉。破壞籤 = 等級 × ' + cfg.breakTicketsPerGrade + '，每升一級就多，永不封頂。',
      '收起：把這把武器的等級記入本局，換一把 +0。本局分數 = 收起過的最高等級。碎掉的武器什麼都不算。',
      '入神：每一次普通鎚擊充能 +1，滿 ' + f.threshold + ' 進入入神 ' + f.strikes + ' 鎚，期間破壞籤 0。結束後這把武器永久 +' + f.scar + ' 張破壞籤。',
      '遺物：開局三選一，本局首次到達 ' + cfg.milestones.map(m => '+' + m).join('、') + ' 各三選一。格子 ' + cfg.relicSlots + ' 個，護盾位 ' + cfg.shieldSlots + ' 個。',
      '鍵盤：空白鍵／Enter 敲，S 收起。',
    ].map(x => '<li>' + x + '</li>').join('');
  }

  // ---------- 動作 ----------
  function doStrike() {
    const r = E.strike(s);
    if (!r) return;
    lastResult = r;
    const el = $('weapon');
    if (r.broke) { el.classList.remove('broke'); void el.offsetWidth; el.classList.add('broke'); }
    render();
  }
  function doShelve() { if (E.shelve(s)) render(); }
  function doEnd() { if (!s.ended && confirm('結束這一局？鐵砧上的武器會自動收起。')) { E.endRun(s); render(); } }
  function newGame() { s = E.newRun(cfg); pendingPick = null; render(); }

  $('btnStrike').onclick = doStrike;
  $('btnShelve').onclick = doShelve;
  $('btnEnd').onclick = doEnd;
  $('offerSheet').addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b || !s.offer) return;
    if (b.dataset.skip) { E.chooseOffer(s, null); render(); return; }
    if (b.dataset.back) { pendingPick = null; render(); return; }
    if (b.dataset.pick != null) {
      const i = +b.dataset.pick; const r = E.chooseOffer(s, i);
      if (!r.ok && r.needReplace) { pendingPick = i; render(); return; }
      render(); return;
    }
    if (b.dataset.drop) { E.chooseOffer(s, pendingPick, b.dataset.drop); pendingPick = null; render(); }
  });
  document.addEventListener('keydown', ev => {
    if (ev.repeat) return;
    if (ev.code === 'Space' || ev.code === 'Enter') { if (!s.offer && !s.ended) { ev.preventDefault(); doStrike(); } }
    else if (ev.key === 's' || ev.key === 'S') { if (!$('btnShelve').disabled) doShelve(); }
  });

  renderRules();
  newGame();
})();
</script>
</body>
</html>
