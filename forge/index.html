<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>鍛造原型</title>
<style>
  :root {
    --bg: #1b1612; --panel: #27201a; --panel2: #332a22; --line: #4a3c30;
    --text: #efe6d8; --muted: #a8998a; --amber: #f2a541; --amber2: #ffcf7a;
    --red: #e5533d; --green: #6cc46a; --purple: #c38cff; --blue: #7fb6ff; --gold: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  body { padding: 12px 16px 40px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  header h1 { font-size: 18px; margin: 0; color: var(--amber2); font-weight: 600; }
  header .ver { color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 8px; }
  .stat { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .stat .k { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .stat .v { font-size: 19px; font-weight: 700; white-space: nowrap; }
  .stat .v small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .stat .v.gold { color: var(--gold); } .stat .v.credit { color: var(--blue); }
  .anger .on { color: var(--red); } .anger .off { color: var(--line); }
  .panel { margin-top: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .panel h2 { margin: 0 0 6px; font-size: 15px; color: var(--amber2); font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
  .panel h2 span { color: var(--muted); font-size: 12px; font-weight: 400; }
  .quota .bar { height: 12px; background: var(--panel2); border-radius: 6px; overflow: hidden; margin-top: 4px; }
  .quota .bar i { display: block; height: 100%; background: var(--green); width: 0; transition: width .2s; }
  .quota .bar i.under { background: var(--amber); }
  .quota .t { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .quota .t b { color: var(--text); font-size: 15px; }
  .swords { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .swords b { color: var(--text); }
  .tchips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tchips span { background: var(--panel2); border-radius: 6px; padding: 2px 8px; font-size: 12px; }
  .tchips span.scrap { color: var(--muted); }
  .list { margin-top: 6px; }
  .list .h { font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
  .list .it { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .list .it .g { font-weight: 700; min-width: 40px; }
  .list .it .v { color: var(--gold); flex: 1; }
  .list .it .m { color: var(--muted); font-size: 12px; }
  .list .it button { padding: 6px 9px; font-size: 12px; font-weight: 500; border-radius: 8px; }
  .list .it.scrap { color: var(--muted); }
  .topbtns { display: flex; gap: 8px; margin-top: 8px; }
  .topbtns button { flex: 1; padding: 10px; font-size: 14px; }
  .weapon { margin-top: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .weapon .grade { font-size: 52px; font-weight: 800; line-height: 1; color: var(--amber2); display: flex; align-items: baseline; gap: 10px; }
  .weapon .grade small { font-size: 15px; color: var(--muted); font-weight: 500; }
  .weapon .grade .val { font-size: 18px; color: var(--gold); font-weight: 600; margin-left: auto; }
  .weapon .sub { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; color: var(--muted); font-size: 13px; }
  .weapon .sub b { color: var(--text); }
  .weapon .empty { font-size: 18px; color: var(--muted); padding: 10px 0; }
  .charge { margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .charge .bar { flex: 1; height: 10px; background: var(--panel2); border-radius: 5px; overflow: hidden; }
  .charge .bar i { display: block; height: 100%; background: var(--amber); width: 0; transition: width .15s; }
  .weapon.fever { border-color: var(--amber); box-shadow: 0 0 0 2px rgba(242,165,65,.25), 0 0 24px rgba(242,165,65,.25); }
  .weapon.fever .charge .bar i { background: var(--purple); }
  .weapon.broke { animation: shake .35s; border-color: var(--red); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
  .paper { margin-top: 8px; background: #efe3cc; color: #2a2018; border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .paper h2 { margin: 0 0 6px; font-size: 14px; display: flex; justify-content: space-between; font-weight: 700; color: #2a2018; }
  .paper h2 span { font-weight: 400; color: #6b5a48; }
  .trow { display: grid; grid-template-columns: 48px 30px 54px 1fr; gap: 6px; align-items: center; padding: 3px 0; border-top: 1px dashed #cdbda2; }
  .trow:first-of-type { border-top: 0; }
  .trow .n { font-weight: 700; }
  .trow .c { font-weight: 700; text-align: right; }
  .trow .p { color: #6b5a48; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .trow .g { font-size: 11px; letter-spacing: 1px; line-height: 1.2; word-break: break-all; }
  .g .b { color: #7a6650; } .g .x { color: #c23f2c; } .g .a { color: #2f8f3a; } .g .w { color: #7b3fcf; } .g .wx { color: #7b3fcf; }
  .g .fev { color: #7b3fcf; font-weight: 700; letter-spacing: 0; }
  .trow.break .n { color: #b2321f; }
  .paper .legend { margin-top: 6px; font-size: 11px; color: #6b5a48; }
  .paper .legend .x { color: #c23f2c; } .paper .legend .a { color: #2f8f3a; } .paper .legend .w { color: #7b3fcf; }
  .actions { display: grid; grid-template-columns: 2fr 1.3fr; gap: 8px; margin-top: 10px; }
  .actions2 { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .actions2 button { flex: 1; padding: 9px 6px; font-size: 13px; font-weight: 500; min-width: 30%; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 14px 10px; cursor: pointer; color: var(--text); background: var(--panel2); font-weight: 600; -webkit-tap-highlight-color: transparent; }
  button:disabled { opacity: .35; cursor: default; }
  button.primary { background: var(--amber); color: #2a1b06; font-size: 22px; padding: 18px 10px; }
  button.primary:active:not(:disabled) { transform: translateY(1px); filter: brightness(.95); }
  button.primary.cooling { opacity: .55; }
  button.danger { background: #4a2a24; }
  button.small { padding: 8px 12px; font-size: 13px; font-weight: 500; }
  button.on { outline: 2px solid var(--amber); }
  .log { margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; min-height: 60px; }
  .log .e { display: flex; gap: 8px; padding: 4px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .log .e:first-child { border-top: 0; font-size: 16px; }
  .log .o { width: 64px; font-weight: 700; flex: none; }
  .log .o.break { color: var(--red); } .log .o.great { color: var(--green); } .log .o.success { color: var(--amber2); }
  .log .o.damage { color: #e59a8c; } .log .o.hold { color: var(--muted); } .log .o.saved { color: var(--blue); }
  .log .o.deliver { color: var(--gold); } .log .o.deposit, .log .o.use, .log .o.rewind { color: var(--blue); } .log .o.settle { color: var(--purple); }
  .log .d { color: var(--muted); flex: 1; }
  .log .d b { color: var(--text); }
  .log .procs { font-size: 12px; color: var(--blue); }
  .relics h3 { margin: 10px 0 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 500; color: var(--text); }
  .chip.empty { color: var(--muted); border-style: dashed; }
  .chip .st { color: var(--blue); font-size: 12px; margin-left: 4px; }
  details { margin-top: 10px; color: var(--muted); font-size: 13px; }
  details summary { cursor: pointer; color: var(--text); }
  details ul { padding-left: 18px; margin: 6px 0; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none; align-items: flex-end; justify-content: center; padding: 12px; z-index: 10; }
  .modal.on { display: flex; }
  .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; overflow-x: hidden; }
  .sheet h2 { margin: 0 0 4px; font-size: 18px; color: var(--amber2); }
  .sheet .hint { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .card { width: 100%; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 8px; font-weight: 400; display: block; }
  .card .t { font-weight: 700; font-size: 16px; display: flex; align-items: baseline; gap: 8px; }
  .card .t .fam { color: var(--muted); font-size: 12px; font-weight: 400; }
  .card .t .price { margin-left: auto; color: var(--blue); font-size: 13px; white-space: nowrap; }
  .card .t .price.gold { color: var(--gold); }
  .card .fx { margin-top: 3px; color: var(--green); font-size: 14px; }
  .card.drop { border-color: var(--red); }
  .card.sold { opacity: .4; }
  .card.cant { border-style: dashed; }
  .skip { width: 100%; margin-top: 10px; }
  .shoprow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .shoprow button { flex: 1; padding: 10px 8px; font-size: 14px; font-weight: 500; min-width: 30%; }
  .shoprow button b { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  .shop h3 { margin: 12px 0 4px; font-size: 14px; color: var(--amber2); font-weight: 600; }
  .end .score { font-size: 56px; font-weight: 800; color: var(--amber2); line-height: 1; margin: 6px 0; }
  .end .score small { font-size: 16px; color: var(--muted); font-weight: 500; margin-left: 8px; }
  .end .new { color: var(--green); font-weight: 700; }
  .end dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 10px 0; font-size: 14px; }
  .end dt { color: var(--muted); } .end dd { margin: 0; }
  .settle .big { font-size: 28px; font-weight: 800; margin: 6px 0; }
  .settle .big.ok { color: var(--green); } .settle .big.miss { color: var(--red); }
  .records { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  .records table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .records th, .records td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  .records th { color: var(--muted); font-weight: 500; }
  .muted { color: var(--muted); }
  .hide { display: none !important; }
  #notice { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #3a2d22; color: var(--amber2); border: 1px solid var(--amber); border-radius: 10px; padding: 10px 14px; font-size: 14px; max-width: 90vw; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #notice.on { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>鍛造原型</h1><span class="ver" id="ver"></span></header>

  <div class="row">
    <div class="stat"><div class="k" id="roundK">回合</div><div class="v" id="round">1</div></div>
    <div class="stat"><div class="k">怒氣</div><div class="v anger" id="anger"></div></div>
    <div class="stat"><div class="k">金幣</div><div class="v gold" id="wallet">0</div></div>
    <div class="stat"><div class="k">劍幣</div><div class="v credit" id="credits">0</div></div>
  </div>

  <div class="panel quota">
    <div class="t"><span>貢品 <b id="tribute">0</b></span><span>配額 <b id="quota">0</b></span></div>
    <div class="bar"><i id="quotaBar"></i></div>
    <div class="swords" id="swords"></div>
    <div class="list" id="offeredList"></div>
    <div class="list" id="rackList"></div>
    <div class="topbtns">
      <button id="btnShop">商店</button>
      <button class="danger" id="btnBell">搖鈴結算</button>
    </div>
  </div>

  <div class="panel shop hide" id="shopPanel">
    <h2>遺物商店 <span id="shopHint"></span></h2>
    <div id="shopOffers"></div>
    <div class="shoprow">
      <button id="btnReroll">重抽<b id="rerollPrice"></b></button>
      <button id="btnDeposit">投入鐵砧上的劍<b>+1 劍幣</b></button>
    </div>
    <div id="merchantBox"></div>
    <div id="bagBox"></div>
  </div>

  <div class="weapon" id="weapon">
    <div id="weaponBody"></div>
  </div>

  <div class="paper" id="paper">
    <h2>抽籤表 <span id="total"></span></h2>
    <div id="rows"></div>
    <div class="legend">基礎 ■ 　<span class="x">✕ 遺物劃掉</span>　<span class="a">■ 遺物新增</span>　<span class="w">■ 只對這把劍</span>　<span id="paperNote"></span></div>
  </div>

  <div class="actions">
    <button class="primary" id="btnStrike">敲</button>
    <button id="btnDeliver">上貢</button>
  </div>
  <div class="actions2" id="quickUse"></div>

  <div class="log" id="log"></div>

  <div class="relics">
    <h3 id="relicTitle">遺物</h3>
    <div class="chips" id="chips"></div>
  </div>

  <details>
    <summary>規則</summary>
    <ul id="rules"></ul>
  </details>

  <div class="records" id="records"></div>
</div>

<div id="notice"></div>
<div class="modal" id="offerModal"><div class="sheet" id="offerSheet"></div></div>
<div class="modal" id="settleModal"><div class="sheet settle" id="settleSheet"></div></div>
<div class="modal" id="endModal"><div class="sheet end" id="endSheet"></div></div>

<script src="config.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  const cfg = window.FORGE_CONFIG, E = window.ForgeEngine;
  const $ = id => document.getElementById(id);
  const KEY = 'forge-proto-records-v3';
  let s = null, pendingPick = null, shopOpen = false;
  // 原作節奏：每鎚冷卻 0.64 秒 ÷ 速度；入神是真實秒數，要搶時間敲。
  const now = () => performance.now() / 1000;
  let nextStrikeAt = 0, strikeAllowed = false;
  function tick() {
    if (s && !s.ended) {
      if (E.expireFever(s)) render();
      const w = s.weapon;
      if (w && E.inFever(s, w)) {
        const fb = $('feverBar'), ft = $('feverText');
        if (fb) fb.style.width = (100 * E.feverRemaining(s, w) / Math.max(0.01, w.feverTotal)) + '%';
        if (ft) ft.textContent = '剩 ' + E.feverRemaining(s, w).toFixed(1) + ' 秒';
      }
      $('btnStrike').classList.toggle('cooling', strikeAllowed && now() < nextStrikeAt);
    }
  }

  function loadRecords() {
    try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && typeof r === 'object') return r; } catch (e) {}
    return { bestScore: 0, bestGrade: 0, bestTribute: 0, runs: 0, cleared: 0, history: [] };
  }
  function saveRecords(r) { try { localStorage.setItem(KEY, JSON.stringify(r)); } catch (e) {} }
  let rec = loadRecords();

  const name = id => { const d = E.item(cfg, id); return d ? d.name : (id === 'fever' ? '入神' : id === 'sword' ? '基礎劍' : id); };
  let noticeTimer = 0;
  function notify(text) { const n = $('notice'); n.textContent = text; n.classList.add('on'); clearTimeout(noticeTimer); noticeTimer = setTimeout(() => n.classList.remove('on'), 2600); }
  const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const money = n => Math.round(n).toLocaleString('en-US');
  const pct = x => (100 * x).toFixed(1) + '%';
  function glyphs(ch, n, cls) { n = Math.max(0, n); if (!n) return ''; const cap = 40; return '<span class="' + cls + '">' + ch.repeat(Math.min(n, cap)) + (n > cap ? '…' : '') + '</span>'; }
  function cardInner(d, extra) { return '<div class="t">' + d.name + '<span class="fam">' + d.family + (d.unlock ? '・成就' : '') + '</span>' + (extra || '') + '</div><div class="fx">' + esc(d.text) + '</div>'; }

  function render() {
    $('ver').textContent = cfg.version;
    const q = E.quota(s);
    $('roundK').textContent = s.endless ? '無盡' : '回合（契約 ' + cfg.contractRound + '）';
    $('round').textContent = s.round;
    $('anger').innerHTML = [0, 1, 2].map(i => '<span class="' + (i < s.misses ? 'on' : 'off') + '">●</span>').join('');
    $('wallet').textContent = money(s.wallet);
    $('credits').textContent = s.credits;

    const inRound = s.phase === 'round' && !s.ended;
    $('tribute').textContent = money(s.delivered);
    $('quota').textContent = money(q);
    const bar = $('quotaBar'); bar.style.width = Math.min(100, 100 * s.delivered / Math.max(1, q)) + '%'; bar.classList.toggle('under', s.delivered < q);
    const need = q - s.delivered, rack = E.rackSwords(s), total = s.swords.length;
    $('swords').innerHTML = '手上共 <b>' + total + '</b> 把劍（鐵砧 ' + (s.weapon ? 1 : 0) + '，架上 ' + rack.length + '）　' + (need > 0 ? '還差 <b>' + money(need) + '</b>' : '<span style="color:var(--green)">已達標</span>，多的都是金幣') + (E.isMerchantRound(s.round) && s.merchant ? '　<span style="color:var(--gold)">商人來了</span>' : '');
    $('offeredList').innerHTML = s.offered.length ? '<div class="h">貢品窗（搖鈴前可取回）</div>' + s.offered.map(x => '<div class="it' + (x.scrap ? ' scrap' : '') + '"><span class="g">' + (x.scrap ? '廢鐵' : '+' + x.grade) + '</span><span class="v">' + money(x.value) + ' G</span>' + (x.scrap ? '' : '<button data-takeback="' + x.serial + '">取回</button>') + '</div>').join('') : '';
    $('rackList').innerHTML = rack.length ? '<div class="h">劍架（沒上貢的劍會帶到下一回合）</div>' + rack.slice().sort((a, b) => b.grade - a.grade).map(w => '<div class="it"><span class="g">+' + w.grade + '</span><span class="v">' + money(w.value) + ' G</span><span class="m">' + (w.strikes ? '鎚 ' + w.strikes + '・充能 ' + w.effects.charge : '新') + (w.issuedRound < s.round ? '・R' + w.issuedRound : '') + '</span><button data-anvil="' + w.serial + '">上鐵砧</button><button data-deliver="' + w.serial + '">上貢</button><button data-deposit="' + w.serial + '">投入</button></div>').join('') : '';
    $('btnShop').disabled = !inRound || s.starterPending;
    $('btnShop').classList.toggle('on', shopOpen);
    $('btnBell').disabled = !inRound || s.starterPending;
    $('btnBell').textContent = total === 0 ? '搖鈴結算' : '搖鈴結算（' + total + ' 把留到下回合）';

    $('shopPanel').classList.toggle('hide', !shopOpen || !inRound);
    if (shopOpen && inRound) renderShop();
    renderWeapon(q);
    renderPaper();
    renderLog();

    $('relicTitle').textContent = '遺物 ' + s.relics.length + '/' + cfg.relicSlots + '（點一下看效果，可丟棄）';
    let chips = s.relics.map(id => { const d = E.item(cfg, id); return '<button class="chip" data-relic="' + id + '" title="' + esc(d.text) + '">' + d.name + relicState(id) + '</button>'; }).join('');
    for (let i = s.relics.length; i < cfg.relicSlots; i++) chips += '<span class="chip empty">空</span>';
    $('chips').innerHTML = chips;

    renderOffer(); renderSettle(); renderEnd(); renderRecords();
  }

  function relicState(id) {
    const w = s.weapon, e = w ? w.effects : null;
    let t = '';
    if (id === 'insurance') t = s.insured ? '本回合已用' : '可用';
    else if (id === 'grudge' && s.grudgeTickets) t = '怨籤 ' + s.grudgeTickets;
    else if (id === 'mourning' && s.mourningGreatTickets) t = '+' + s.mourningGreatTickets;
    else if (e) {
      if (id === 'cornerstone') t = e.cornerstoneUses ? '已用' : '可用';
      else if (id === 'phoenix') t = e.phoenix ? '已用' : '可用';
      else if (id === 'spine') t = e.spineShield ? '護盾就緒' : '損傷 ' + (e.spineLosses % 2) + '/2';
      else if (id === 'brace') t = e.brace + '/6';
      else if (id === 'repair') t = '−' + 15 * e.temperScars + '%';
      else if (id === 'gear' && e.bronzeTickets) t = '+' + e.bronzeTickets;
      else if (id === 'kingcup' && e.kingTickets) t = '+' + e.kingTickets;
      else if (id === 'rage' && (e.heldGreatLevels || e.rageHolds)) t = '存 ' + e.heldGreatLevels;
      else if (id === 'royalseal' && e.royalLevels) t = '存 ' + e.royalLevels;
      else if (id === 'chime' && e.chimeLevels) t = '存 ' + e.chimeLevels;
      else if (id === 'deeppearl') t = (2 - e.pearlUses) + ' 次';
    }
    return t ? '<span class="st">' + t + '</span>' : '';
  }

  function renderShop() {
    $('shopHint').textContent = s.starterPending ? '' : '劍幣 ' + s.credits + '　金幣 ' + money(s.wallet);
    $('shopOffers').innerHTML = s.offers.map((o, i) => {
      const d = E.item(cfg, o.id);
      const owned = s.relics.includes(o.id);
      const can = !o.sold && !owned && s.credits >= o.price;
      const full = s.relics.length >= cfg.relicSlots;
      const extra = '<span class="price">' + (o.sold ? '已售出' : owned ? '已持有' : '劍幣 ' + o.price + (can ? (full ? '・格滿，買了要丟一個' : '') : '（你有 ' + s.credits + '）')) + '</span>';
      return '<button class="card' + (o.sold || owned ? ' sold' : (can ? '' : ' cant')) + '" data-buy="' + i + '" ' + (o.sold || owned ? 'disabled' : '') + '>' + cardInner(d, extra) + '</button>';
    }).join('') || '<div class="muted">這回合沒有遺物可賣。</div>';
    const rp = E.rerollPrice(s);
    $('rerollPrice').textContent = rp === 0 ? '免費' : money(rp) + ' 金幣';
    $('btnReroll').disabled = s.wallet < rp;
    $('btnDeposit').disabled = !s.weapon || s.weapon.broken;

    let m = '';
    if (s.merchant) {
      m += '<h3>商人（每 3 回合）</h3>';
      m += s.merchant.offers.map((o, i) => {
        const left = E.merchantRemaining(o);
        const d = o.id === 'sword' ? { name: '基礎劍', family: '武器', text: '多一把 +0 的劍' } : E.item(cfg, o.id);
        const extra = '<span class="price gold">' + (left ? money(o.price) + ' 金幣・剩 ' + left : '賣完') + '</span>';
        const can = left > 0 && s.wallet >= o.price;
        return '<button class="card' + (left ? (can ? '' : ' cant') : ' sold') + '" data-merchant="' + i + '" ' + (left ? '' : 'disabled') + '>' + cardInner(d, extra) + '</button>';
      }).join('');
    } else m += '<h3 class="muted" style="color:var(--muted)">商人只在第 3、6、9… 回合來</h3>';
    $('merchantBox').innerHTML = m;

    const bag = Object.entries(s.consumables).filter(([k, v]) => v > 0);
    $('bagBox').innerHTML = '<h3>消耗品</h3>' + (bag.length ? '<div class="chips">' + bag.map(([k, v]) => '<span class="chip" title="' + esc(E.item(cfg, k).text) + '">' + name(k) + ' ×' + v + '</span>').join('') + '</div>' : '<div class="muted">沒有。用法：鐵砧下方的按鈕。</div>');
  }

  function renderWeapon(q) {
    const w = s.weapon, el = $('weapon');
    el.classList.toggle('fever', !!w && E.inFever(s, w));
    if (!w) {
      const pend = E.pendingSwords(s);
      $('weaponBody').innerHTML = '<div class="empty">鐵砧是空的。' + (pend ? '從劍架點「上鐵砧」選一把。' : '手上沒有劍了。') + '</div>';
      $('btnStrike').textContent = pend ? '鐵砧空的' : '搖鈴結算';
      strikeAllowed = false;
      $('btnStrike').disabled = pend > 0 || !(s.phase === 'round' && !s.ended && !s.starterPending);
      $('btnDeliver').disabled = true; $('btnDeliver').textContent = '上貢';
      $('quickUse').innerHTML = E.canRewind(s) ? '<button data-use="rewind">回溯錶：撤銷上一鎚（剩 ' + s.consumables.rewind + '）</button>' : '';
      return;
    }
    const e = w.effects, fever = E.inFever(s, w);
    const sub = [];
    sub.push('本把最高 <b>' + money(e.peak) + ' G</b>');
    sub.push('鎚 <b>' + w.strikes + '</b>');
    if (e.inheritedSuccess) sub.push('繼承成功籤 <b>+' + e.inheritedSuccess + '</b>');
    if (e.wardArmed) sub.push('<b style="color:var(--blue)">鱗片就緒</b>');
    if (e.chalkArmed) sub.push('<b style="color:var(--blue)">粉筆就緒</b>');
    if (e.powderArmed) sub.push('<b style="color:var(--red)">火藥就緒</b>');
    if (e.starReady) sub.push('閃紋：下一鎚破壞 ×0.6');
    if (e.threadReady) sub.push('紅縷：下一鎚破壞 ×0.8');
    if (e.diceReady) sub.push('盲骰：下一鎚大成功 +3');
    const charge = fever ? '<div class="charge"><span>入神中</span><div class="bar"><i id="feverBar" style="width:' + (100 * E.feverRemaining(s, w) / Math.max(0.01, w.feverTotal)) + '%"></i></div><span id="feverText">剩 ' + E.feverRemaining(s, w).toFixed(1) + ' 秒</span></div>'
      : '<div class="charge"><span>充能</span><div class="bar"><i style="width:' + (10 * e.charge) + '%"></i></div><span>' + e.charge + '/10' + (e.charge >= 10 ? '　下一鎚入神' : '') + '</span></div>';
    $('weaponBody').innerHTML = '<div class="grade"><span>+' + w.grade + '</span><small>第 ' + w.serial + ' 把</small><span class="val">' + money(w.value) + ' G</span></div><div class="sub">' + sub.join('　') + '</div>' + charge;
    $('btnStrike').textContent = '敲';
    strikeAllowed = (s.phase === 'round' && !s.ended && !s.starterPending) && w.grade < cfg.maxGrade;
    $('btnStrike').disabled = !strikeAllowed;
    $('btnDeliver').disabled = !(s.phase === 'round' && !s.ended && !s.starterPending);
    $('btnDeliver').textContent = '上貢 ' + money(w.value) + ' G';
    const uses = [];
    for (const id of ['ward', 'chalk', 'powder', 'starshard']) if (s.consumables[id] > 0) uses.push('<button data-use="' + id + '">' + name(id) + ' ×' + s.consumables[id] + '</button>');
    if (E.canRewind(s)) uses.push('<button data-use="rewind">回溯錶 ×' + s.consumables.rewind + '</button>');
    uses.push('<button data-rack="1">放回架上</button>');
    uses.push('<button data-depositcur="1">投入販賣機 +1 劍幣</button>');
    $('quickUse').innerHTML = uses.join('');
  }

  function renderPaper() {
    const w = s.weapon;
    const tp = E.ticketPaper(s, w);
    const ticks = w ? E.chances(s, w, E.inFever(s, w)) : null;
    const total = tp.deck.reduce((a, b) => a + b, 0);
    $('total').textContent = '共 ' + Math.round(total) + ' 張' + (w ? '　破壞率依等級成長' : '');
    let rows = '';
    E.OUTCOMES.forEach((k, j) => {
      const deck = tp.deck[j], common = tp.common[j], base = tp.baseline[j];
      let g = '';
      if (j === 0 && tp.fever) g = '<span class="fev">入神：破壞籤 0</span>';
      else {
        const top = Math.max(base, common, deck);
        for (let i = 0; i < Math.min(top, 40); i++) {
          if (i < deck) g += (i < base && i < common) ? '<span class="b">■</span>' : (i < common ? '<span class="a">■</span>' : '<span class="w">■</span>');
          else g += (i < common) ? '<span class="wx">✕</span>' : (i < base ? '<span class="x">✕</span>' : '');
        }
        if (top > 40) g += '…';
      }
      const p = ticks ? pct(ticks[j] / 1000) : '—';
      rows += '<div class="trow ' + k + '"><div class="n">' + E.LABEL[k] + '</div><div class="c">' + Math.round(deck) + '</div><div class="p">' + p + '</div><div class="g">' + g + '</div></div>';
    });
    $('rows').innerHTML = rows;
    const notes = [];
    if (tp.seal) notes.push('墨繩結 ×0.9');
    if (tp.grudge) notes.push('怨籤 ' + tp.grudge);
    $('paperNote').textContent = notes.join('　');
  }

  function renderLog() {
    $('log').innerHTML = s.log.filter(e => e.kind !== 'settle').slice(0, 8).map(e => {
      let d = '', o = e.outcome;
      if (e.kind === 'deliver') d = '<b>+' + e.before + '</b> 上貢 <b>' + money(e.value) + '</b> G';
      else if (e.kind === 'deposit') d = '投入販賣機，劍幣 +' + e.credits;
      else if (e.kind === 'use') d = '使用 ' + name(e.id);
      else if (e.kind === 'takeback') d = '從貢品窗取回 <b>+' + e.before + '</b>';
      else if (e.kind === 'rewind') d = '撤銷上一鎚';
      else if (e.broke) d = '<b>+' + e.before + '</b> 碎了' + (e.valueAfter > 0 ? '，廢鐵 ' + money(e.valueAfter) + ' G' : '');
      else d = '+' + e.before + ' → <b>+' + e.after + '</b>　' + money(e.valueAfter) + ' G' + (e.inFever ? '　<span class="muted">入神</span>' : '');
      const procs = e.procs && e.procs.length ? '<div class="procs">' + e.procs.map(p => esc((p.item && p.item !== 'fever' ? name(p.item) + '：' : '') + p.text)).join('　') + '</div>' : '';
      return '<div class="e"><div class="o ' + o + '">' + (E.LABEL[o] || o) + '</div><div class="d">' + d + procs + '</div></div>';
    }).join('') || '<div class="muted">還沒敲。</div>';
  }

  function renderOffer() {
    const m = $('offerModal');
    if (!s.starterPending && pendingPick == null) { m.classList.remove('on'); return; }
    m.classList.add('on');
    let html = '';
    if (pendingPick != null) {
      const d = E.item(cfg, s.offers[pendingPick].id);
      html += '<h2>遺物格滿了</h2><div class="hint">要拿「' + d.name + '」，得丟掉一個：</div>';
      s.relics.forEach(rid => { const h = E.item(cfg, rid); html += '<button class="card drop" data-drop="' + rid + '">' + cardInner(h) + '</button>'; });
      html += '<button class="skip" data-back="1">返回</button>';
    } else {
      html += '<h2>開局：免費三選一</h2><div class="hint">之後的遺物在回合中的商店用劍幣買（把劍投進販賣機換）。遺物格 ' + cfg.relicSlots + ' 個。</div>';
      s.offers.forEach((o, i) => { const d = E.item(cfg, o.id); html += '<button class="card" data-pick="' + i + '">' + cardInner(d) + '</button>'; });
      html += '<button class="skip" data-skip="1">跳過</button>';
    }
    $('offerSheet').innerHTML = html;
  }

  function renderSettle() {
    const m = $('settleModal');
    if (s.phase !== 'settle' || s.ended) { m.classList.remove('on'); return; }
    m.classList.add('on');
    const L = s.lastSettle;
    const nextQ = E.baseQuota(cfg, s.round + 1);
    $('settleSheet').innerHTML =
      '<h2>第 ' + L.round + ' 回合結算</h2>' +
      '<div class="big ' + (L.passed ? 'ok' : 'miss') + '">' + (L.passed ? '達標' : '不足') + '　<span style="font-size:16px;color:var(--text);font-weight:500">貢品 ' + money(L.tribute) + ' / 配額 ' + money(L.quota) + '</span></div>' +
      (L.contractDone ? '<div class="new">契約完成！怒氣歸零，進入無盡，配額每回合 ×' + cfg.endlessGrowth + '。</div>' : '') +
      (L.pardon ? '<div class="new">赦狀擋下了一次死亡。</div>' : '') +
      '<dl><dt>貢品</dt><dd>' + (L.items.map(x => (x.scrap ? '廢鐵' : '+' + x.grade) + '（' + money(x.value) + '）').join('、') || '無') + '</dd>' +
      '<dt>金幣</dt><dd>+' + money(L.gold) + '</dd>' +
      (L.carried ? '<dt>帶到下回合</dt><dd>' + L.carried + ' 把劍</dd>' : '') +
      (L.credit ? '<dt>下回合抵扣</dt><dd>' + money(L.credit) + '</dd>' : '') +
      '<dt>怒氣</dt><dd>' + L.misses + ' / 3' + (L.passed ? '' : '　<span style="color:var(--red)">+1</span>') + '</dd></dl>' +
      '<button class="primary" id="btnNext" style="width:100%">第 ' + (s.round + 1) + ' 回合　配額 ' + money(nextQ) + '</button>';
    $('btnNext').onclick = () => { E.nextRound(s); shopOpen = s.round >= 2; render(); };
  }

  function renderEnd() {
    const m = $('endModal');
    if (!s.ended) { m.classList.remove('on'); return; }
    if (!m.classList.contains('on')) commitRecord();
    m.classList.add('on');
    const sm = E.summary(s);
    const reason = { misses: '怒氣滿了', quit: '主動結束' }[sm.endReason] || '';
    const route = sm.route.filter(r => r.picked).map(r => (r.at === 'start' ? '開局' : 'R' + r.round) + '：' + name(r.picked)).join('　');
    $('endSheet').innerHTML =
      '<h2>這一局結束　<span class="muted" style="font-size:13px">' + reason + '</span></h2>' +
      '<div class="score">' + sm.score + '<small>達標回合</small></div>' +
      (s._newRecord ? '<div class="new">歷史新高！</div>' : '<div class="muted">歷史最高 ' + rec.bestScore + ' 回合</div>') +
      '<dl><dt>撐到</dt><dd>第 ' + sm.round + ' 回合' + (sm.cleared ? '，契約完成' : '') + '</dd><dt>總上貢</dt><dd>' + money(sm.totalTribute) + ' G</dd><dt>最高武器</dt><dd>+' + sm.bestGrade + '</dd><dt>破壞</dt><dd>' + sm.breaks + ' 次</dd><dt>入神</dt><dd>' + sm.fevers + ' 次</dd><dt>買劍</dt><dd>' + sm.swordsBought + ' 把</dd><dt>消耗品</dt><dd>' + sm.consumablesUsed + ' 次，回溯 ' + sm.rewinds + ' 次</dd><dt>路線</dt><dd>' + (route || '無') + '</dd><dt>最終遺物</dt><dd>' + (sm.relics.map(name).join('、') || '無') + '</dd></dl>' +
      '<button class="primary" id="btnAgain" style="width:100%">再來一局</button>';
    $('btnAgain').onclick = newGame;
  }

  function commitRecord() {
    if (s._recorded) return;
    s._recorded = true;
    const sm = E.summary(s);
    s._newRecord = sm.score > rec.bestScore;
    rec.bestScore = Math.max(rec.bestScore, sm.score); rec.bestGrade = Math.max(rec.bestGrade, sm.bestGrade); rec.bestTribute = Math.max(rec.bestTribute, sm.totalTribute);
    rec.runs++; if (sm.cleared) rec.cleared++;
    const d = new Date(), p2 = n => String(n).padStart(2, '0');
    rec.history.unshift({ date: d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()), score: sm.score, grade: sm.bestGrade, tribute: sm.totalTribute, cleared: sm.cleared, relics: sm.relics });
    rec.history = rec.history.slice(0, 20);
    saveRecords(rec);
  }

  function renderRecords() {
    let html = '<h3 class="muted" style="margin:0 0 6px;font-size:13px;font-weight:500">紀錄　局數 ' + rec.runs + '　契約完成 ' + rec.cleared + '　最高 ' + rec.bestScore + ' 回合　最高武器 +' + rec.bestGrade + '</h3>';
    if (rec.history.length) {
      html += '<table><tr><th>時間</th><th>回合</th><th>武器</th><th>總上貢</th><th>遺物</th></tr>' +
        rec.history.map(h => '<tr><td>' + h.date.slice(5) + '</td><td><b>' + h.score + '</b>' + (h.cleared ? ' ✓' : '') + '</td><td>+' + h.grade + '</td><td>' + money(h.tribute) + '</td><td class="muted">' + (h.relics || []).map(name).join('、') + '</td></tr>').join('') + '</table>';
    }
    html += '<div style="margin-top:8px"><button class="small" id="btnClear">清除紀錄</button>　<button class="small" id="btnQuit">放棄這一局</button></div>';
    $('records').innerHTML = html;
    $('btnClear').onclick = () => { if (confirm('清除所有紀錄？')) { rec = { bestScore: 0, bestGrade: 0, bestTribute: 0, runs: 0, cleared: 0, history: [] }; saveRecords(rec); render(); } };
    $('btnQuit').onclick = () => { if (!s.ended && confirm('放棄這一局？分數以目前達標回合數計。')) { E.endRun(s); render(); } };
  }

  function renderRules() {
    $('rules').innerHTML = [
      '一局是連續回合。契約 ' + cfg.contractRound + ' 回合，達標後怒氣歸零進無盡。上貢不足累計 3 次，局結束。分數 = 達標回合數。',
      '每回合發 3 把劍，鎚數不限。劍是實體：沒上貢、沒碎的劍會帶到下一回合，可以跨回合專養一把。鐵砧一次一把，空了就從劍架選，不會自動放。價值 = 320 × 1.5^等級，大成功時價值跳 ×2.5。',
      '上貢是把劍放進貢品窗，搖鈴前隨時可以取回。貢品總值 ≥ 配額就達標，而且全額變金幣。',
      '商店整回合都開著：遺物用劍幣（把劍投進販賣機換，1 把 1 幣），重抽用金幣（起價 15% 配額，每次 ×2.5）。商人每 3 回合來一次，賣劍（40% 配額起，每買一把 ×3）和消耗品。',
      '籤是權重，每一鎚獨立抽。籤紙上是張數；破壞籤另外乘上隨等級成長的係數，無遺物時 +4 是 25%、+10 是 47%，鐵砧上的百分比才是真實機率。',
      '節奏跟原作一樣：每鎚冷卻 0.64 秒（速度類遺物會縮短）。入神：每一次普通鎚擊充能 +1，滿 10 下一鎚進入入神 4 秒，期間破壞籤 0，要搶時間敲，最多 7 鎚。',
      '鍵盤：空白鍵／Enter 敲，S 上貢。',
    ].map(x => '<li>' + x + '</li>').join('');
  }

  function doStrike() {
    if (!s.weapon) { if (E.pendingSwords(s) === 0) doBell(); return; }
    if (now() < nextStrikeAt) return;
    const r = E.strike(s);
    if (!r) return;
    nextStrikeAt = now() + E.strikeInterval(s, r.inFever);
    if (r.broke) { const el = $('weapon'); el.classList.remove('broke'); void el.offsetWidth; el.classList.add('broke'); }
    render();
  }
  function doDeliver() { if (E.deliver(s)) render(); }
  function doBell() {
    const q = E.quota(s);
    if (s.delivered < q && !confirm('貢品 ' + money(s.delivered) + ' 不到配額 ' + money(q) + '，搖鈴會吃一次怒氣。確定？')) return;
    E.settle(s); shopOpen = false; render();
  }
  function newGame() { s = E.newRun(cfg, { clock: now }); pendingPick = null; shopOpen = false; nextStrikeAt = 0; render(); }

  $('btnStrike').onclick = doStrike;
  $('btnDeliver').onclick = doDeliver;
  $('btnBell').onclick = doBell;
  $('btnShop').onclick = () => { shopOpen = !shopOpen; render(); };
  $('btnReroll').onclick = () => { E.reroll(s); render(); };
  $('btnDeposit').onclick = () => { if (E.depositCurrent(s)) render(); };
  const listClick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.anvil) E.putOnAnvil(s, +b.dataset.anvil);
    else if (b.dataset.deliver) E.deliver(s, +b.dataset.deliver);
    else if (b.dataset.deposit) E.depositSword(s, +b.dataset.deposit);
    else if (b.dataset.takeback) E.takeBack(s, +b.dataset.takeback);
    else return;
    render();
  };
  $('rackList').addEventListener('click', listClick);
  $('offeredList').addEventListener('click', listClick);
  $('chips').addEventListener('click', ev => {
    const b = ev.target.closest('button[data-relic]'); if (!b) return;
    const d = E.item(cfg, b.dataset.relic);
    if (confirm(d.name + '：' + d.text + '\n\n要丟掉這個遺物嗎？丟了不退劍幣。')) { E.removeRelic(s, b.dataset.relic); render(); }
  });
  $('shopOffers').addEventListener('click', ev => {
    const b = ev.target.closest('button[data-buy]'); if (!b) return;
    const i = +b.dataset.buy; const r = E.buyRelic(s, i);
    if (!r.ok && r.needReplace) pendingPick = i;
    else if (!r.ok && r.reason === 'credits') notify('劍幣不夠：要 ' + s.offers[i].price + ' 枚，你有 ' + s.credits + ' 枚。把劍投進販賣機可以換劍幣（1 把 1 枚）。');
    else if (!r.ok) notify('現在不能買。');
    render();
  });
  $('merchantBox').addEventListener('click', ev => {
    const b = ev.target.closest('button[data-merchant]'); if (!b) return;
    const i = +b.dataset.merchant; const r = E.buyMerchant(s, i);
    if (!r.ok && r.reason === 'gold') notify('金幣不夠：要 ' + money(s.merchant.offers[i].price) + '，你有 ' + money(s.wallet) + '。');
    else if (!r.ok) notify('現在不能買。');
    render();
  });
  $('quickUse').addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.use) { E.useConsumable(s, b.dataset.use); render(); }
    else if (b.dataset.depositcur) { if (E.depositCurrent(s)) render(); }
    else if (b.dataset.rack) { E.rackAnvil(s); render(); }
  });
  $('offerSheet').addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.skip) { E.skipStarter(s); render(); return; }
    if (b.dataset.back) { pendingPick = null; render(); return; }
    if (b.dataset.pick != null) { E.buyRelic(s, +b.dataset.pick); render(); return; }
    if (b.dataset.drop && pendingPick != null) { E.buyRelic(s, pendingPick, b.dataset.drop); pendingPick = null; render(); }
  });
  document.addEventListener('keydown', ev => {
    if (ev.repeat || s.phase !== 'round' || s.starterPending || pendingPick != null) return;
    if (ev.code === 'Space' || ev.code === 'Enter') { ev.preventDefault(); if (!$('btnStrike').disabled) doStrike(); }
    else if (ev.key === 's' || ev.key === 'S') { if (!$('btnDeliver').disabled) doDeliver(); }
  });

  renderRules();
  newGame();
  setInterval(tick, 60);
  // 測試用：讓自動化腳本拿得到目前的局。
  window.__forge = { get state() { return s; }, render };
})();
</script>
</body>
</html>
